name: TASK-IMP-007 format once

on:
  push:
    branches:
      - codex/task-imp-007-progression-protection-corrections

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Format only TASK-IMP-007 files
        run: |
          dart format \
            apps/mobile/lib/features/progress/views/progression_section.dart \
            packages/data/lib/src/progression/supabase_progression_repository.dart
      - name: Commit formatter output and remove helper
        run: |
          git rm .github/workflows/007-format-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "stone-set-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "TASK-IMP-007: Apply Dart formatting"
          git push origin HEAD:codex/task-imp-007-progression-protection-corrections
