name: Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Format target source files
        shell: bash
        run: |
          dart format \
            apps/dashboard/lib/src/features/routines/views/dashboard_routine_views.dart \
            apps/dashboard/lib/src/features/shell/views/dashboard_authenticated_shell.dart
          git diff -- \
            apps/dashboard/lib/src/features/routines/views/dashboard_routine_views.dart \
            apps/dashboard/lib/src/features/shell/views/dashboard_authenticated_shell.dart

      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dart-formatted-source
          path: |
            apps/dashboard/lib/src/features/routines/views/dashboard_routine_views.dart
            apps/dashboard/lib/src/features/shell/views/dashboard_authenticated_shell.dart
          if-no-files-found: error
          retention-days: 1
