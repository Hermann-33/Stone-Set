name: Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Format and commit exact Dart output
        shell: bash
        run: |
          dart format \
            apps/dashboard/lib/src/features/routines/views/dashboard_routine_views.dart \
            apps/dashboard/lib/src/features/shell/views/dashboard_authenticated_shell.dart
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/dashboard/lib/src/features/routines/views/dashboard_routine_views.dart \
              apps/dashboard/lib/src/features/shell/views/dashboard_authenticated_shell.dart
            git commit -m "Format direct routine publication UI"
            git push origin HEAD:${{ github.head_ref }}
          fi
