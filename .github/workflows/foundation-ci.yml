name: Foundation CI

on:
  workflow_dispatch:
    inputs:
      update_mobile_goldens:
        description: Generate Linux mobile golden candidates for review
        required: false
        type: boolean
        default: false
      update_dashboard_goldens:
        description: Generate Linux dashboard golden candidates for review
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  repository:
    name: Documentation and repository checks
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.update_mobile_goldens && !inputs.update_dashboard_goldens) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Set up Node 24.11.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Restore exact locked dependencies
        run: |
          dart pub get --enforce-lockfile
          npm ci

      - name: Check repository structure and hygiene
        run: dart run bin/stone_set.dart repository-check

      - name: Verify canonical rank assets
        run: npm run test:rank-assets

      - name: Verify restore did not change tracked files
        run: git diff --exit-code -- .

  flutter_dart:
    name: Flutter and Dart
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.update_mobile_goldens && !inputs.update_dashboard_goldens) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Set up Node 24.11.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Show installed Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Restore exact locked dependencies
        run: |
          dart pub get --enforce-lockfile
          npm ci

      - name: Verify pinned tool versions
        run: dart run bin/stone_set.dart tool-version-check

      - name: Verify generated Riverpod and typed-route sources
        run: |
          dart run bin/stone_set.dart generate
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

      - name: Check formatting
        run: dart run bin/stone_set.dart format-check

      - name: Run strict static analysis
        run: dart run bin/stone_set.dart analyze

      - name: Stage canonical mobile rank assets
        run: dart run bin/stone_set.dart stage-rank-assets

      - name: Compare deterministic mobile goldens
        working-directory: apps/mobile
        run: flutter test test/goldens/mobile_home_golden_test.dart

      - name: Upload focused mobile golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-golden-diffs-${{ github.run_attempt }}
          path: apps/mobile/test/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Compare deterministic dashboard goldens
        working-directory: apps/dashboard
        run: flutter test test/goldens/dashboard_overview_golden_test.dart

      - name: Upload focused dashboard golden diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-golden-diffs-${{ github.run_attempt }}
          path: apps/dashboard/test/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit and widget tests
        run: dart run bin/stone_set.dart test

      - name: Run dashboard tests in Chrome
        working-directory: apps/dashboard
        run: flutter test --platform chrome

      - name: Build Android release APK
        run: dart run bin/stone_set.dart build-android

      - name: Verify Android release rank asset bundle
        run: |
          mapfile -t rank_assets < <(unzip -Z1 apps/mobile/build/app/outputs/flutter-apk/app-release.apk | grep -E '(^|/)\.dart_tool/stone_set_assets/ranks/[0-9]{2}_[^/]+\.png$')
          test "${#rank_assets[@]}" -eq 20
          test "$(printf '%s\n' "${rank_assets[@]}" | sort -u | wc -l)" -eq 20

      - name: Build dashboard release web bundle
        run: dart run bin/stone_set.dart build-dashboard

      - name: Review dashboard bundle for privileged credential markers
        shell: bash
        run: |
          if grep -RInaE 'sb_secret_|STONE_SET_SERVICE_ROLE_KEY|SUPABASE_ACCESS_TOKEN|SUPABASE_DB_PASSWORD' apps/dashboard/build/web; then
            echo 'Privileged credential marker found in the public dashboard bundle.' >&2
            exit 1
          fi

      - name: Verify checks and builds did not change tracked files
        run: |
          git diff --exit-code -- .
          test -z "$(git status --porcelain)"

  mobile_golden_candidates:
    name: Generate Linux mobile golden candidates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_mobile_goldens }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Restore exact locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Stage canonical mobile rank assets
        run: dart run bin/stone_set.dart stage-rank-assets

      - name: Generate deterministic mobile golden candidates
        working-directory: apps/mobile
        run: flutter test test/goldens/mobile_home_golden_test.dart --update-goldens

      - name: Upload Linux golden candidates for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-golden-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/mobile/test/goldens/*.png
          if-no-files-found: error
          retention-days: 7

  dashboard_golden_candidates:
    name: Generate Linux dashboard golden candidates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_dashboard_goldens }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Restore exact locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Generate deterministic dashboard golden candidates
        working-directory: apps/dashboard
        run: flutter test test/goldens/dashboard_overview_golden_test.dart --update-goldens

      - name: Upload Linux golden candidates for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-golden-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/dashboard/test/goldens/*.png
          if-no-files-found: error
          retention-days: 7

  mobile_api24_profile:
    name: Android API 24 profile
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.update_mobile_goldens && !inputs.update_dashboard_goldens) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Restore exact locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Stage canonical mobile rank assets
        run: dart run bin/stone_set.dart stage-rank-assets

      - name: Enable KVM access for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the bounded mobile scenario in profile mode
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          working-directory: apps/mobile
          emulator-options: >-
            -no-snapshot-save -no-window -skin 360x800 -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: |
            mkdir -p build
            adb shell wm size 360x800
            adb shell wm density 160
            printf 'model=%s\napi=%s\nabi=%s\nsize=%s\ndensity=%s\nflutter=%s\ncommand=%s\n' "$(adb shell getprop ro.product.model | tr -d '\r')" "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" "$(adb shell wm size | tr -d '\r')" "$(adb shell wm density | tr -d '\r')" "$(flutter --version --machine | tr -d '\n')" 'flutter drive --no-dds --profile -d emulator-5554 --driver=integration_test/performance_driver.dart --target=integration_test/mobile_shell_profile_test.dart' > build/api24-profile-environment.txt
            flutter drive --no-dds --profile -d emulator-5554 --driver=integration_test/performance_driver.dart --target=integration_test/mobile_shell_profile_test.dart

      - name: Upload API 24 profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-api24-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/mobile/build/api24-profile-environment.txt
            apps/mobile/build/integration_response_data.json
          if-no-files-found: warn
          retention-days: 7

  supabase:
    name: Local Supabase
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.update_mobile_goldens && !inputs.update_dashboard_goldens) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node 24.11.1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Restore exact npm dependencies
        run: npm ci

      - name: Verify Supabase CLI version
        shell: bash
        run: |
          actual_version="$(npm exec -- supabase --version)"
          test "$actual_version" = "2.111.0"

      - name: Verify Auth configuration and operator safety
        run: node --test supabase/tests/config/auth_config.test.mjs tool/operator/operator.test.mjs

      - name: Discover supported local CLI flags
        run: |
          npm exec -- supabase --help
          npm exec -- supabase start --help
          npm exec -- supabase db reset --help
          npm exec -- supabase test db --help
          npm exec -- supabase db lint --help
          npm exec -- supabase stop --help

      - name: Start local Supabase
        # Supabase prints disposable local credentials on successful startup. Keep them out of CI logs.
        run: npm exec -- supabase start > /dev/null

      - name: Reset local database
        run: npm exec -- supabase db reset --local

      - name: Verify running Auth lifecycle and signup denial
        shell: bash
        run: |
          eval "$(npm exec -- supabase status -o env)"
          STONE_SET_RUN_SUPABASE_INTEGRATION=1 \
            STONE_SET_SUPABASE_URL="$API_URL" \
            STONE_SET_SUPABASE_ANON_KEY="$ANON_KEY" \
            STONE_SET_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node --test \
              supabase/tests/integration/identity_lifecycle.integration.test.mjs \
              supabase/tests/integration/signup_disabled.integration.test.mjs

      - name: Run local pgTAP tests
        run: npm exec -- supabase test db --local

      - name: Lint local database
        run: npm exec -- supabase db lint --local --fail-on warning

      - name: Stop only the Stone Set local stack
        if: always()
        run: npm exec -- supabase stop --project-id stone-set --no-backup
