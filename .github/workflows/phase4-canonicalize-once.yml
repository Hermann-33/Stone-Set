name: Phase 4 canonicalize once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore exact Dart dependencies
        run: dart pub get --enforce-lockfile
      - name: Restore generated sources and format handwritten Phase 4 files
        shell: bash
        run: |
          (cd apps/mobile && dart run build_runner build)
          (cd apps/dashboard && dart run build_runner build)
          dart format \
            apps/mobile/lib/app/router/mobile_routes.dart \
            apps/mobile/lib/features/home/controllers/home_controller.dart \
            apps/mobile/lib/features/home/data/live_home_schedule_mapper.dart \
            apps/mobile/lib/features/home/views/home_screen.dart \
            apps/mobile/lib/features/week/views/week_screen.dart \
            apps/mobile/test/mobile_shell_home_test.dart \
            apps/mobile/test/support/fake_scheduling_repository.dart \
            packages/data/lib/src/scheduling/supabase_scheduling_repository.dart
          git rm .github/workflows/phase4-canonicalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TASK-IMP-004: Canonicalize generated and handwritten Dart sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
