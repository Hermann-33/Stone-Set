name: Phase 4 exact CI formatter once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore exact Dart dependencies
        run: dart pub get --enforce-lockfile
      - name: Format exactly as CI and self-remove
        shell: bash
        run: |
          dart format .
          git rm .github/workflows/phase4-format-ci-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TASK-IMP-004: Apply exact CI Dart formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
