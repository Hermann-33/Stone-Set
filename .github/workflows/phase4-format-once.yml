name: Phase 4 formatter once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Format Phase 4 and remove this helper
        shell: bash
        run: |
          dart format \
            apps/mobile/lib/app/router/mobile_routes.dart \
            apps/mobile/lib/features/home/controllers/home_controller.dart \
            apps/mobile/lib/features/home/data/live_home_schedule_mapper.dart \
            apps/mobile/lib/features/home/views/home_screen.dart \
            apps/mobile/lib/features/week \
            apps/mobile/test/mobile_shell_home_test.dart \
            apps/mobile/test/support/fake_scheduling_repository.dart \
            apps/mobile/test/week_screen_test.dart \
            packages/data/lib/scheduling.dart \
            packages/data/lib/src/scheduling \
            packages/data/lib/stone_set_data.dart \
            packages/data/test/scheduling \
            packages/domain/lib/scheduling.dart \
            packages/domain/lib/src/scheduling \
            packages/domain/lib/stone_set_domain.dart
          git rm .github/workflows/phase4-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mobile/lib/app/router/mobile_routes.dart \
            apps/mobile/lib/features/home/controllers/home_controller.dart \
            apps/mobile/lib/features/home/data/live_home_schedule_mapper.dart \
            apps/mobile/lib/features/home/views/home_screen.dart \
            apps/mobile/lib/features/week \
            apps/mobile/test/mobile_shell_home_test.dart \
            apps/mobile/test/support/fake_scheduling_repository.dart \
            apps/mobile/test/week_screen_test.dart \
            packages/data/lib/scheduling.dart \
            packages/data/lib/src/scheduling \
            packages/data/lib/stone_set_data.dart \
            packages/data/test/scheduling \
            packages/domain/lib/scheduling.dart \
            packages/domain/lib/src/scheduling \
            packages/domain/lib/stone_set_domain.dart
          git commit -m 'TASK-IMP-004: Apply canonical Phase 4 formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
