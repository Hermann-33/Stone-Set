name: Phase 5A generate exact sources once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore exact Dart dependencies
        run: dart pub get --enforce-lockfile
      - name: Regenerate mobile sources and self-remove
        shell: bash
        run: |
          (cd apps/mobile && dart run build_runner build)
          git rm .github/workflows/phase5a-generate-ci-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'TASK-IMP-005A: Regenerate mobile sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
