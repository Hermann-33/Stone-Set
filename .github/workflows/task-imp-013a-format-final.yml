name: TASK-IMP-013A one-shot formatter

on:
  push:
    branches:
      - agent/task-imp-013a-offline-cache

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/task-imp-013a-offline-cache

      - name: Install Foundation CI Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Format exact CI-reported sources
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/mobile/integration_test/mobile_shell_profile_test.dart \
            apps/mobile/lib/features/home/controllers/home_controller.dart \
            apps/mobile/lib/features/home/views/home_screen.dart \
            apps/mobile/lib/features/identity/controllers/mobile_session_controller.dart \
            apps/mobile/lib/features/identity/providers/identity_providers.dart \
            apps/mobile/lib/features/local/data/mobile_snapshot_codec.dart \
            apps/mobile/lib/features/local/data/sqflite_mobile_snapshot_store.dart \
            apps/mobile/lib/features/progress/providers/progress_providers.dart \
            apps/mobile/lib/features/progress/views/progress_screen.dart \
            apps/mobile/lib/features/shell/views/mobile_authenticated_shell.dart \
            apps/mobile/lib/features/shell/views/mobile_destination_placeholder.dart \
            apps/mobile/lib/features/sync/controllers/mobile_sync_controller.dart \
            apps/mobile/lib/features/week/providers/scheduling_providers.dart \
            apps/mobile/lib/features/week/views/week_screen.dart \
            apps/mobile/lib/features/workout/controllers/workout_controller.dart \
            apps/mobile/lib/features/workout/data/sqflite_workout_local_store.dart \
            apps/mobile/lib/features/workout/providers/workout_providers.dart \
            apps/mobile/test/mobile_local_database_test.dart \
            apps/mobile/test/mobile_session_controller_test.dart \
            apps/mobile/test/mobile_shell_home_test.dart \
            apps/mobile/test/mobile_sync_controller_test.dart \
            apps/mobile/test/support/fake_mobile_snapshot_store.dart

      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'stone-set-ci'
          git config user.email 'stone-set-ci@users.noreply.github.com'
          git add -- apps/mobile
          git commit -m 'TASK-IMP-013A: apply CI canonical Dart formatting'
          git push origin HEAD:agent/task-imp-013a-offline-cache
