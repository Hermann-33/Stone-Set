name: TASK-IMP-013A temporary formatter

on:
  push:
    branches:
      - agent/task-imp-013a-offline-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'stone-set-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Foundation CI Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Format changed Dart sources only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t source_paths < <(
            git diff --name-only origin/main...HEAD -- '*.dart' \
              | grep -v '\.g\.dart$' \
              | sort
          )
          if (( ${#source_paths[@]} == 0 )); then
            exit 0
          fi
          printf 'Formatting %s changed Dart files\n' "${#source_paths[@]}"
          dart format "${source_paths[@]}"

      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'stone-set-ci'
          git config user.email 'stone-set-ci@users.noreply.github.com'
          git add -- apps/mobile
          git commit -m 'TASK-IMP-013A: apply canonical Dart formatting'
          git push origin "HEAD:${GITHUB_REF_NAME}"
