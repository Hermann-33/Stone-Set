name: TASK-IMP-014 one-shot formatter

on:
  push:
    branches:
      - agent/task-imp-014-guidance-publication-freshness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/task-imp-014-guidance-publication-freshness

      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Restore exact locked Dart dependencies
        run: dart pub get --enforce-lockfile

      - name: Format the TASK-IMP-014 dashboard regression only
        run: dart format apps/dashboard/test/src/features/exercises/dashboard_guidance_publication_freshness_test.dart

      - name: Commit canonical formatter output
        shell: bash
        run: |
          if git diff --quiet -- apps/dashboard/test/src/features/exercises/dashboard_guidance_publication_freshness_test.dart; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dashboard/test/src/features/exercises/dashboard_guidance_publication_freshness_test.dart
          git commit -m "TASK-IMP-014: apply locked Dart formatting"
          git push origin HEAD:agent/task-imp-014-guidance-publication-freshness
