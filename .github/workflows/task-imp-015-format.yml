name: TASK-IMP-015 canonical formatter

on:
  push:
    branches:
      - agent/task-imp-015-final
    paths:
      - apps/mobile/lib/features/week/views/week_day_detail_sheet.dart
      - .github/workflows/task-imp-015-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/task-imp-015-final
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Canonically format focused file
        run: dart format apps/mobile/lib/features/week/views/week_day_detail_sheet.dart
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile/lib/features/week/views/week_day_detail_sheet.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/features/week/views/week_day_detail_sheet.dart
          git commit -m "TASK-IMP-015: apply canonical Dart formatting"
          git push origin HEAD:agent/task-imp-015-final
