name: TASK-IMP-017 CI defect patch

on:
  push:
    branches:
      - codex/task-imp-017-guidance-propagation-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out task branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/task-imp-017-guidance-propagation-e2e
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore exact locked workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Apply CI defect patch
        run: python .github/scripts/task_imp_017_ci_fix.py
      - name: Format patched Dart
        run: dart format apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart
      - name: Commit patched product/test files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart \
            supabase/tests/database/guidance_publication_activation_e2e.test.sql
          git commit -m 'TASK-IMP-017: repair analyzer and E2E fixtures'
          git push origin HEAD:codex/task-imp-017-guidance-propagation-e2e
