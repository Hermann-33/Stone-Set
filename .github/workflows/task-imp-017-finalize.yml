name: TASK-IMP-017 final publication preflight patch

on:
  push:
    branches:
      - codex/task-imp-017-guidance-propagation-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: codex/task-imp-017-guidance-propagation-e2e
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Patch authoritative YouTube publication preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('apps/dashboard/lib/src/features/exercises/controllers/dashboard_guidance_media_controller.dart')
          text = controller.read_text()
          old = """const _youtubePreviewRequiredMessage =
              'YouTube preview validation is required before publication. Load the preview, '
              'play the video until Stone Set marks it validated, then publish again. '
              'Preview validation expires after one hour.';

          final exerciseMediaRepositoryProvider"""
          new = """const _youtubePreviewRequiredMessage =
              'YouTube preview validation is required before publication. Load the preview, '
              'play the video until Stone Set marks it validated, then publish again. '
              'Preview validation expires after one hour.';

          bool isGuidanceYouTubePublicationReady(
            GuidanceYouTubeReference? youtube, {
            DateTime? now,
          }) {
            if (youtube == null) return true;
            if (youtube.validationStatus != YouTubeValidationStatus.validated) return false;
            final validatedAt = youtube.validatedAt;
            if (validatedAt == null) return false;
            final instant = (now ?? DateTime.now()).toUtc();
            return !validatedAt.toUtc().isBefore(
              instant.subtract(const Duration(hours: 1)),
            );
          }

          final exerciseMediaRepositoryProvider"""
          assert old in text, 'controller header anchor not found'
          text = text.replace(old, new, 1)
          old = """    if (current.manifest.youtube?.validationStatus == YouTubeValidationStatus.previewRequired) {
          state = AsyncData("""
          new = """    if (!isGuidanceYouTubePublicationReady(current.manifest.youtube)) {
          state = AsyncData("""
          assert old in text, 'controller publication guard anchor not found'
          text = text.replace(old, new, 1)
          controller.write_text(text)

          view = Path('apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart')
          text = view.read_text()
          old = """          if (youtube?.validationStatus ==
