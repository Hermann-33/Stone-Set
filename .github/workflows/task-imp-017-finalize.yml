name: TASK-IMP-017 final publication preflight patch

on:
  push:
    branches:
      - codex/task-imp-017-guidance-propagation-e2e

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: codex/task-imp-017-guidance-propagation-e2e
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Apply final publication preflight patch
        run: python .github/scripts/task_imp_017_patch.py
      - name: Format changed Dart files
        run: |
          dart format \
            apps/dashboard/lib/src/features/exercises/controllers/dashboard_guidance_media_controller.dart \
            apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_media_controller_test.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_publication_boundary_test.dart
      - name: Restore exact dependencies
        run: dart pub get --enforce-lockfile
      - name: Run focused dashboard regressions
        run: |
          cd apps/dashboard
          flutter test \
            test/src/features/exercises/dashboard_guidance_media_controller_test.dart \
            test/src/features/exercises/dashboard_guidance_publication_boundary_test.dart
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/dashboard/lib/src/features/exercises/controllers/dashboard_guidance_media_controller.dart \
            apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_media_controller_test.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_publication_boundary_test.dart
          git commit -m 'TASK-IMP-017: mirror authoritative YouTube publication gate'
          git push origin HEAD:codex/task-imp-017-guidance-propagation-e2e
