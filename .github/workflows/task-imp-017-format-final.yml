name: TASK-IMP-017 final Dart formatting

on:
  push:
    branches:
      - codex/task-imp-017-guidance-propagation-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out task branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/task-imp-017-guidance-propagation-e2e
      - name: Set up Flutter 3.44.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Restore exact locked workspace dependencies
        run: dart pub get --enforce-lockfile
      - name: Canonically format exact changed Dart files
        run: |
          dart format \
            apps/dashboard/lib/src/features/exercises/controllers/dashboard_guidance_media_controller.dart \
            apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_media_controller_test.dart \
            apps/mobile/test/workout/workout_guidance_loader_test.dart
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/dashboard/lib/src/features/exercises/controllers/dashboard_guidance_media_controller.dart \
            apps/dashboard/lib/src/features/exercises/views/dashboard_guidance_editor_view.dart \
            apps/dashboard/test/src/features/exercises/dashboard_guidance_media_controller_test.dart \
            apps/mobile/test/workout/workout_guidance_loader_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'TASK-IMP-017: apply canonical final Dart formatting'
          git push origin HEAD:codex/task-imp-017-guidance-propagation-e2e
