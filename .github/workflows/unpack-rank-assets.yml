name: Generate rank assets

on:
  push:
    branches:
      - codex/task-asset-001-rank-emblems
    paths:
      - tools/generate_rank_assets.py
      - tools/synchronize_rank_asset_docs.py
      - .github/workflows/unpack-rank-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rank asset branch
        uses: actions/checkout@v4
        with:
          ref: codex/task-asset-001-rank-emblems
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install Pillow==11.3.0

      - name: Generate and verify rank assets
        run: python tools/generate_rank_assets.py

      - name: Synchronize canonical documentation
        run: python tools/synchronize_rank_asset_docs.py

      - name: Remove temporary upload artifacts
        run: |
          rm -f assets/rank-assets-payload.zip
          rm -f assets/ranks/01_bronze_i.png.base64

      - name: Commit generated assets and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "TASK-ASSET-001: finalize rank emblem assets"
            git push origin HEAD:codex/task-asset-001-rank-emblems
          fi
