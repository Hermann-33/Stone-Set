name: stone_set_mobile
description: Android foundation for the Stone Set mobile application.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: 3.12.2
  flutter: 3.44.7

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 17.4.0
  riverpod_annotation: 4.0.6
  stone_set_data: 0.1.0
  stone_set_domain: 0.1.0
  stone_set_ui: 0.1.0
  supabase_flutter: 2.17.1

dev_dependencies:
  build_runner: 2.16.0
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  go_router_builder: 4.4.0
  riverpod_generator: 4.0.8

flutter:
  uses-material-design: true
